# Render Blueprint: Render reads this when you choose New -> Blueprint.
services:
  - type: web
    name: ai-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: ANTHROPIC_API_KEY
        sync: false   # Render asks you for the value; it is never stored in git
      - key: APP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_MESSAGES_PER_HOUR
        value: "30"
