<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPCBank Loan Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #f5f7fa;
    --card: #ffffff;
    --border: #d6dee8;
    --shadow: 0 8px 24px rgba(30, 50, 80, 0.10), 0 1px 3px rgba(30, 50, 80, 0.06);
    --text: #1f2933;
    --muted: #7b8794;
    --bot-bubble: #f1f4f8;
    --user-bubble: #2f6fed;
    --user-text: #ffffff;
    --input-bg: #f7f9fb;
    --accent: #2f6fed;
    --error: #c53030;
    --rec: #e53e3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0f1419;
      --card: #1a2027;
      --border: #2e3843;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      --text: #e4e7eb;
      --muted: #8a96a3;
      --bot-bubble: #252d36;
      --input-bg: #202831;
      --error: #fc8181;
      --rec: #fc8181;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Noto Sans Khmer", "Khmer Sangam MN", "Khmer MN", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    height: min(620px, calc(100vh - 32px));
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 14px 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 600; font-size: 14px;
    flex-shrink: 0;
  }
  .title { flex: 1; min-width: 0; }
  .title strong { display: block; font-size: 15px; }
  .title span { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    border: none; background: none; cursor: pointer;
    color: var(--muted); padding: 6px; border-radius: 8px;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--bot-bubble); color: var(--text); }
  .icon-btn.on { color: var(--accent); }

  /* English / Khmer switch */
  .lang {
    display: flex;
    background: var(--bot-bubble);
    border-radius: 999px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang button {
    border: none; background: none; cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 600;
    color: var(--muted);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .lang button[aria-pressed="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 9px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.bot  { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.error { color: var(--error); }
  .notice {
    align-self: center;
    background: #2aabee;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    max-height: 120px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button.send, button.mic {
    border: none;
    border-radius: 12px;
    width: 44px;
    flex-shrink: 0;
    cursor: pointer;
    display: grid; place-items: center;
  }
  button.send { background: var(--accent); color: #fff; }
  button.mic { background: var(--bot-bubble); color: var(--text); position: relative; }
  button.mic:hover { color: var(--accent); }
  button.mic.listening { background: var(--rec); color: #fff; }
  button.mic.listening::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 12px;
    box-shadow: 0 0 0 0 var(--rec);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 60%, transparent); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }
  button:disabled { opacity: .5; cursor: default; }

  /* Password screen (only when the server has APP_PASSWORD set) */
  .card { position: relative; }
  #lock {
    position: absolute; inset: 0;
    background: var(--card);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; padding: 24px;
    text-align: center;
  }
  #lock[hidden] { display: none; }
  #lock form { border: none; padding: 0; width: 100%; max-width: 280px; }
  #lock input {
    flex: 1; min-width: 0;
    border: 1px solid var(--border);
    background: var(--input-bg); color: var(--text);
    border-radius: 12px; padding: 10px 12px;
    font: inherit; outline: none;
  }
  #lock input:focus { border-color: var(--accent); }
  #lock p { margin: 0; color: var(--muted); font-size: 14px; }
  #lock .lock-error { color: var(--error); min-height: 1.5em; }
  button.mic[hidden] { display: none; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <div class="avatar">AI</div>
      <div class="title">
        <strong>PPCBank Loan Assistant</strong>
        <span id="status">Online</span>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en-US" aria-pressed="true">EN</button>
        <button type="button" data-lang="km-KH" aria-pressed="false">ខ្មែរ</button>
      </div>
      <button class="icon-btn on" id="speaker" title="Read replies aloud" aria-label="Read replies aloud" aria-pressed="true">
        <svg id="speaker-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <svg id="speaker-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6"/><path d="m17 9 6 6"/></svg>
      </button>
      <button class="icon-btn" id="reset" title="New conversation" aria-label="New conversation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
    </header>

    <div id="messages">
      <div class="empty" id="empty"></div>
    </div>

    <form id="form">
      <textarea id="input" rows="1" autofocus></textarea>
      <button class="mic" id="mic" type="button" aria-label="Speak">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
      </button>
      <button class="send" id="send" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </form>

    <div id="lock" hidden>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <strong>PPCBank Loan Assistant</strong>
      <p id="lock-text"></p>
      <form id="lock-form">
        <input id="lock-input" type="password" autocomplete="current-password" aria-label="Password">
        <button class="send" type="submit" aria-label="Unlock">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>
      <p class="lock-error" id="lock-error"></p>
    </div>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const micBtn = document.getElementById("mic");
  const speakerBtn = document.getElementById("speaker");
  const statusEl = document.getElementById("status");

  const session = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
  let busy = false;

  // ------------------------------------------------------------ language

  const TEXT = {
    "en-US": {
      hello: "👋 Hi! Ask me about PPCBank loans. Type or tap the mic to talk.",
      leadSent: "✓ Your details were sent to a PPCBank loan officer",
      placeholder: "Type a message...",
      online: "Online",
      typing: "Typing...",
      listening: "Listening... tap the mic to stop",
      speaking: "Speaking...",
      recognizing: "Recognizing your voice...",
      micTitle: "Speak in English",
      noMic: "Microphone access is blocked. Click the lock icon in the address bar and allow the microphone (on Mac also check System Settings → Privacy & Security → Microphone).",
      micMissing: "No microphone found.",
      needsHttps: "Voice needs a secure page: open it at http://localhost or an https:// address.",
      noSpeech: "I didn't hear anything - tap the mic and try again.",
      sttFailed: "Couldn't recognize your voice",
      ttsFailed: "Couldn't play the voice reply",
      tapForSound: "Tap anywhere to turn on sound.",
      lockText: "Enter the password to start chatting.",
      wrongPassword: "Wrong password.",
      limit: "You've sent a lot of messages. Please wait a while and try again.",
    },
    "km-KH": {
      hello: "👋 សួស្តី! សួរខ្ញុំអំពីកម្ចីរបស់ PPCBank។ វាយអក្សរ ឬចុចមីក្រូហ្វូនដើម្បីនិយាយ។",
      leadSent: "✓ ព័ត៌មានរបស់អ្នកត្រូវបានផ្ញើទៅមន្ត្រីឥណទាន PPCBank",
      placeholder: "វាយសារ...",
      online: "អនឡាញ",
      typing: "កំពុងសរសេរ...",
      listening: "កំពុងស្តាប់... ចុចមីក្រូហ្វូនដើម្បីបញ្ឈប់",
      speaking: "កំពុងនិយាយ...",
      recognizing: "កំពុងស្គាល់សំឡេងរបស់អ្នក...",
      micTitle: "និយាយជាភាសាខ្មែរ",
      noMic: "មីក្រូហ្វូនត្រូវបានបិទ។ ចុចរូបសោនៅរបារអាសយដ្ឋាន ហើយអនុញ្ញាតមីក្រូហ្វូន (នៅលើ Mac សូមពិនិត្យ System Settings → Privacy & Security → Microphone)។",
      micMissing: "រកមិនឃើញមីក្រូហ្វូនទេ។",
      needsHttps: "សំឡេងត្រូវការទំព័រសុវត្ថិភាព៖ សូមបើកតាម http://localhost ឬអាសយដ្ឋាន https://។",
      noSpeech: "ខ្ញុំមិនបានឮអ្វីទេ - សូមចុចមីក្រូហ្វូនហើយព្យាយាមម្តងទៀត។",
      sttFailed: "មិនអាចស្គាល់សំឡេងរបស់អ្នកបានទេ",
      ttsFailed: "មិនអាចចាក់សំឡេងឆ្លើយតបបានទេ",
      tapForSound: "ចុចកន្លែងណាមួយដើម្បីបើកសំឡេង។",
      lockText: "សូមបញ្ចូលពាក្យសម្ងាត់ដើម្បីចាប់ផ្តើមជជែក។",
      wrongPassword: "ពាក្យសម្ងាត់មិនត្រឹមត្រូវ។",
      limit: "អ្នកបានផ្ញើសារច្រើនពេក។ សូមរង់ចាំបន្តិចហើយព្យាយាមម្តងទៀត។",
    },
  };

  let lang = localStorageGet("lang") || "en-US";
  const t = (key) => TEXT[lang][key];

  function setLang(value) {
    lang = value;
    localStorageSet("lang", value);
    document.documentElement.lang = value.slice(0, 2);
    document.querySelectorAll(".lang button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b.dataset.lang === value));
    });
    input.placeholder = t("placeholder");
    micBtn.title = t("micTitle");
    document.getElementById("lock-text").textContent = t("lockText");
    const empty = document.getElementById("empty");
    if (empty) empty.textContent = t("hello");
    stopListening();
    stopSpeaking();
    setStatus();
  }

  document.querySelectorAll(".lang button").forEach((b) => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });

  function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

  // ------------------------------------------------------------ status

  let statusNote = "";  // temporary message, e.g. an error

  function setStatus(key) {
    if (key) statusNote = "";
    const state = busy ? "typing" : recognizing ? "recognizing" : listening ? "listening" : "online";
    statusEl.textContent = statusNote || t(key || state);
  }

  function noteStatus(text) {
    statusNote = text;
    statusEl.textContent = text;
    setTimeout(() => { if (statusNote === text) { statusNote = ""; setStatus(); } }, 5000);
  }

  // ------------------------------------------------------------ chat

  function addMessage(role, text) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
    return el;
  }

  // Status line in the chat, e.g. "details sent to a loan officer".
  function addNotice(text) {
    const el = document.createElement("div");
    el.className = "notice";
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollDown();
  }

  function scrollDown() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setBusy(value) {
    busy = value;
    sendBtn.disabled = value;
    micBtn.disabled = value || recognizing;
    setStatus();
  }

  async function send(text) {
    stopSpeaking();
    addMessage("user", text);
    const botEl = addMessage("bot", "");
    botEl.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    setBusy(true);
    const replyLang = lang;

    let raw = "", reply = "";
    let leadShown = false;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, message: text, lang, password }),
      });
      if (res.status === 401) { showLock(); throw new Error(t("wrongPassword")); }
      if (res.status === 429) throw new Error(t("limit"));
      if (!res.ok) throw new Error("Server error " + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        raw += decoder.decode(value, { stream: true });
        // Events arrive inline as \x01name\x02; take them out of the text.
        const events = [...raw.matchAll(/\x01([^\x02]*)\x02/g)].map((m) => m[1]);
        if (events.includes("lead_sent") && !leadShown) {
          leadShown = true;
          addNotice(t("leadSent"));
        }
        reply = raw.replace(/\x01[^\x02]*\x02/g, "");
        const partial = reply.indexOf("\x01");
        if (partial !== -1) reply = reply.slice(0, partial);
        const errAt = reply.indexOf("\x00");
        if (errAt !== -1) {
          throw new Error(reply.slice(errAt + 1));
        }
        if (reply) botEl.textContent = reply;
        scrollDown();
      }
      if (!reply) botEl.textContent = "(no reply)";
    } catch (err) {
      botEl.classList.add("error");
      botEl.textContent = "⚠️ " + (err.message || "Could not reach the server.");
      reply = "";
    } finally {
      setBusy(false);
      input.focus();
    }
    if (reply) speak(reply, replyLang);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    stopListening();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    autoResize();
    send(text);
  });

  // Enter sends, Shift+Enter makes a new line.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  }
  input.addEventListener("input", autoResize);

  document.getElementById("reset").addEventListener("click", async () => {
    if (busy) return;
    stopListening();
    stopSpeaking();
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session, password }),
    }).catch(() => {});
    messagesEl.innerHTML = '<div class="empty" id="empty"></div>';
    document.getElementById("empty").textContent = t("hello");
    input.focus();
  });

  // ------------------------------------------------------------ voice input
  // The browser records the microphone and the server turns it into text
  // (/api/stt). This works in every browser and supports Khmer, unlike the
  // browser's own SpeechRecognition, which only works fully in Chrome/Edge.

  const STT_RATE = 16000;
  const SILENCE_STOP_MS = 1500;   // stop after this much quiet once speech was heard
  const NO_SPEECH_STOP_MS = 8000; // give up if nothing is said
  const MAX_RECORD_MS = 30000;

  let listening = false;
  let recognizing = false;
  let recorder = null;   // { stream, ctx, chunks, rate, ... } while recording

  micBtn.addEventListener("click", () => {
    unlockAudio();
    listening ? stopListening(true) : startListening();
  });

  function voiceError(text) {
    addMessage("bot error", "⚠️ " + text);
  }

  async function startListening() {
    if (busy || recognizing || listening) return;
    stopSpeaking();
    if (!navigator.mediaDevices?.getUserMedia) {
      voiceError(t("needsHttps"));
      return;
    }
    setListening(true);
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch (err) {
      setListening(false);
      voiceError(err.name === "NotAllowedError" || err.name === "SecurityError" ? t("noMic") : t("micMissing"));
      return;
    }
    if (!listening) { stream.getTracks().forEach((tr) => tr.stop()); return; }  // cancelled meanwhile

    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") await ctx.resume();
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const mute = ctx.createGain();
    mute.gain.value = 0;
    source.connect(processor);
    processor.connect(mute);
    mute.connect(ctx.destination);  // processor only runs when connected

    const started = performance.now();
    const rec = recorder = { stream, ctx, processor, chunks: [], rate: ctx.sampleRate,
                             heardSpeech: false, lastLoud: started, noise: 0.004 };

    processor.onaudioprocess = (e) => {
      if (recorder !== rec) return;
      const data = new Float32Array(e.inputBuffer.getChannelData(0));
      rec.chunks.push(data);

      // Simple voice-activity detection: loud = well above the background noise.
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);
      const now = performance.now();
      if (rms > Math.max(0.015, rec.noise * 3)) {
        rec.heardSpeech = true;
        rec.lastLoud = now;
      } else if (!rec.heardSpeech) {
        rec.noise = rec.noise * 0.9 + rms * 0.1;  // learn the room's noise level
      }

      if (rec.heardSpeech && now - rec.lastLoud > SILENCE_STOP_MS) stopListening(true);
      else if (!rec.heardSpeech && now - started > NO_SPEECH_STOP_MS) stopListening(false);
      else if (now - started > MAX_RECORD_MS) stopListening(true);
    };
  }

  // send=true: transcribe what was recorded and send it; false: discard it.
  function stopListening(send = false) {
    const rec = recorder;
    if (!rec) { if (listening) setListening(false); return; }
    recorder = null;
    rec.processor.onaudioprocess = null;
    rec.stream.getTracks().forEach((tr) => tr.stop());
    rec.ctx.close().catch(() => {});
    setListening(false);
    if (send && rec.heardSpeech) transcribe(rec.chunks, rec.rate);
    else if (send) noteStatus(t("noSpeech"));
  }

  async function transcribe(chunks, rate) {
    const wav = encodeWav(downsample(chunks, rate, STT_RATE), STT_RATE);
    const sttLang = lang;
    recognizing = true;
    micBtn.disabled = true;
    setStatus();
    try {
      const res = await fetch("/api/stt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ audio: await blobToBase64(wav), lang: sttLang, password }),
      });
      if (res.status === 401) { showLock(); return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Server error " + res.status);
      if (!data.text) { noteStatus(t("noSpeech")); return; }
      input.value = (input.value.trim() ? input.value.trimEnd() + " " : "") + data.text;
      autoResize();
      form.requestSubmit();
    } catch (err) {
      voiceError(t("sttFailed") + " (" + (err.message || "network") + ")");
    } finally {
      recognizing = false;
      micBtn.disabled = busy;
      setStatus();
    }
  }

  function setListening(value) {
    listening = value;
    micBtn.classList.toggle("listening", value);
    micBtn.setAttribute("aria-pressed", String(value));
    setStatus();
  }

  // Merge recorded chunks and resample to `outRate` (simple averaging).
  function downsample(chunks, inRate, outRate) {
    const total = chunks.reduce((n, c) => n + c.length, 0);
    const input = new Float32Array(total);
    let offset = 0;
    for (const c of chunks) { input.set(c, offset); offset += c.length; }
    if (inRate === outRate) return input;
    const ratio = inRate / outRate;
    const out = new Float32Array(Math.floor(total / ratio));
    for (let i = 0; i < out.length; i++) {
      const start = Math.floor(i * ratio), end = Math.min(Math.floor((i + 1) * ratio), total);
      let sum = 0;
      for (let j = start; j < end; j++) sum += input[j];
      out[i] = sum / Math.max(1, end - start);
    }
    return out;
  }

  // 16-bit mono PCM WAV.
  function encodeWav(samples, rate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }

  // ------------------------------------------------------------ voice output
  // Replies are spoken with the server's neural voices (/api/tts), which include
  // Khmer. Most devices have no Khmer voice, so the browser's own speech is only
  // a fallback for English.

  let speakerOn = localStorageGet("speaker") !== "off";
  const player = new Audio();
  let speakToken = 0;        // bumped to cancel whatever is being spoken
  let finishPlayback = null; // resolves the clip that is playing now
  let audioUnlocked = false;

  // Browsers (Safari especially) only allow sound that starts from a tap or key
  // press. Playing a silent clip during the first one unlocks `player` for later.
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    player.src = URL.createObjectURL(encodeWav(new Float32Array(1600), 16000));
    player.play().catch(() => { audioUnlocked = false; });
  }
  document.addEventListener("pointerdown", unlockAudio);
  document.addEventListener("keydown", unlockAudio);

  function renderSpeaker() {
    speakerBtn.classList.toggle("on", speakerOn);
    speakerBtn.setAttribute("aria-pressed", String(speakerOn));
    document.getElementById("speaker-on").hidden = !speakerOn;
    document.getElementById("speaker-off").hidden = speakerOn;
  }

  speakerBtn.addEventListener("click", () => {
    speakerOn = !speakerOn;
    localStorageSet("speaker", speakerOn ? "on" : "off");
    if (!speakerOn) stopSpeaking();
    renderSpeaker();
  });

  // Split into pieces of a few sentences so the first one starts playing quickly.
  function speechChunks(text) {
    const clean = text.replace(/[*_#`>|~]+/g, " ").replace(/\s+/g, " ").trim();
    const sentences = clean.match(/[^.!?។៕]+[.!?។៕]*\s*/g) || [clean];
    const chunks = [];
    let current = "";
    for (let s of sentences) {
      while (s.length > 300) {  // very long sentence: cut at a space if possible
        let cut = s.lastIndexOf(" ", 300);
        if (cut < 100) cut = 300;
        chunks.push(s.slice(0, cut));
        s = s.slice(cut);
      }
      if (current && (current + s).length > 250) { chunks.push(current); current = ""; }
      current += s;
    }
    if (current.trim()) chunks.push(current);
    return chunks.map((c) => c.trim()).filter(Boolean);
  }

  function fetchSpeech(text, code) {
    const p = fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, lang: code, password }),
    }).then(async (res) => {
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || "Server error " + res.status);
      }
      return res.blob();
    });
    p.catch(() => {});  // a cancelled prefetch must not log an unhandled error
    return p;
  }

  function playClip(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const done = () => {
        player.onended = player.onerror = null;
        finishPlayback = null;
        URL.revokeObjectURL(url);
      };
      finishPlayback = () => { done(); resolve(); };
      player.onended = () => { done(); resolve(); };
      player.onerror = () => { done(); reject(new Error("could not play audio")); };
      player.src = url;
      player.play().catch((err) => { done(); reject(err); });
    });
  }

  async function speak(text, code) {
    if (!speakerOn) return;
    stopSpeaking();
    const token = ++speakToken;
    const chunks = speechChunks(text);
    if (!chunks.length) return;
    setStatus("speaking");

    let next = fetchSpeech(chunks[0], code);
    for (let i = 0; i < chunks.length; i++) {
      try {
        const clip = await next;
        if (token !== speakToken) return;
        next = i + 1 < chunks.length ? fetchSpeech(chunks[i + 1], code) : null;
        await playClip(clip);
        if (token !== speakToken) return;
      } catch (err) {
        if (token !== speakToken) return;
        if (err.name === "NotAllowedError") {
          noteStatus(t("tapForSound"));
        } else if (!browserSpeak(chunks.slice(i).join(" "), code)) {
          voiceError(t("ttsFailed") + " (" + (err.message || "network") + ")");
        }
        break;
      }
    }
    if (token === speakToken) setStatus();
  }

  // Fallback: the browser's built-in voice. Returns false if it has none for `code`.
  function browserSpeak(text, code) {
    if (!("speechSynthesis" in window)) return false;
    const base = code.slice(0, 2);
    const voice = speechSynthesis.getVoices().find((v) => v.lang.replace("_", "-").startsWith(base));
    if (!voice) return false;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code;
    u.voice = voice;
    u.onend = () => setStatus();
    speechSynthesis.speak(u);
    return true;
  }

  function stopSpeaking() {
    speakToken++;
    player.pause();
    if (finishPlayback) finishPlayback();
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    setStatus();
  }

  // Voices load asynchronously in some browsers.
  if ("speechSynthesis" in window) speechSynthesis.getVoices();

  // ------------------------------------------------------------ password

  // Remembered on this device so visitors don't retype it every time.
  let password = localStorageGet("password") || "";
  const lockEl = document.getElementById("lock");
  const lockInput = document.getElementById("lock-input");
  const lockError = document.getElementById("lock-error");

  function showLock(message = "") {
    stopListening();
    stopSpeaking();
    lockError.textContent = message;
    lockEl.hidden = false;
    lockInput.value = "";
    lockInput.focus();
  }

  // Returns true if the server accepts `password` (or needs none).
  async function checkPassword() {
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      return res.status !== 401;
    } catch {
      return true;  // server unreachable: let the chat show the error
    }
  }

  document.getElementById("lock-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    password = lockInput.value;
    if (await checkPassword()) {
      localStorageSet("password", password);
      lockEl.hidden = true;
      input.focus();
    } else {
      showLock(t("wrongPassword"));
    }
  });

  // ------------------------------------------------------------ start

  renderSpeaker();
  setLang(lang);
  checkPassword().then((ok) => { if (!ok) showLock(); });
</script>
</body>
</html>
